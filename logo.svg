<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" width="220" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a84c"/>
      <stop offset="50%" style="stop-color:#f0d080"/>
      <stop offset="100%" style="stop-color:#a8832a"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d4a4a"/>
      <stop offset="100%" style="stop-color:#0a3535"/>
    </linearGradient>
  </defs>

  <!-- Big C shape -->
  <path d="M 52 8 A 38 38 0 1 0 52 82 L 52 72 A 28 28 0 1 1 52 18 Z" fill="url(#goldGrad)"/>

  <!-- Superscript 3 -->
  <text x="54" y="16" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="url(#goldGrad)">3</text>

  <!-- House shape inside C -->
  <g transform="translate(34, 28)">
    <!-- Roof -->
    <polygon points="18,0 36,16 0,16" fill="url(#goldGrad)" opacity="0.95"/>
    <!-- House body -->
    <rect x="5" y="16" width="26" height="20" fill="url(#goldGrad)" opacity="0.85"/>
    <!-- Door -->
    <rect x="13" y="24" width="10" height="12" fill="#0d4a4a"/>
  </g>

  <!-- Crane vertical pole -->
  <line x1="72" y1="18" x2="72" y2="72" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <!-- Crane horizontal arm -->
  <line x1="72" y1="18" x2="100" y2="18" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <!-- Crane diagonal cables -->
  <line x1="86" y1="18" x2="72" y2="38" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>
  <line x1="100" y1="18" x2="72" y2="48" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>
  <!-- Crane hook lines -->
  <line x1="86" y1="18" x2="86" y2="32" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <line x1="100" y1="18" x2="100" y2="38" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <!-- Base lines -->
  <line x1="55" y1="72" x2="100" y2="72" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="60" y1="68" x2="95" y2="68" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.6"/>
  <line x1="65" y1="64" x2="90" y2="64" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Company Name -->
  <text x="110" y="42" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="url(#goldGrad)" letter-spacing="1">CONCEPT</text>
  <text x="110" y="56" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="url(#goldGrad)" letter-spacing="1">CONSTRUCTION</text>
  <text x="110" y="70" font-family="Georgia, serif" font-size="9" fill="url(#goldGrad)" letter-spacing="2">&amp; CONSULTANT</text>
</svg>
